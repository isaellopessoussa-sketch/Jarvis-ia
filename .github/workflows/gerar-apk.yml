name: Gerar APK Kivy do Jarvis

on:
  push:
    branches:
      - main
      - principal
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Buildozer e Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk fontconfig libsqlite3-dev clean-css-cli gperf libgstreamer1.0-dev idxproctools
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Criar configuração do Buildozer
        run: |
          buildozer init
          # Ajusta o arquivo para incluir a biblioteca do Gemini e dar as permissões de Internet
          sed -i 's/title = My Application/title = Jarvis/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = jarvis/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.isaellopes/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,google-generativeai/' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec

      - name: Gerar o APK (Pode levar uns 10 minutos)
        run: |
          buildozer android debug
          
      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Kivy-APK
          path: bin/*.apk
